<svg width="962" height="134" viewBox="0 0 962 134" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">Dev Quote of the Day</title>
  <desc id="descId">"Weeks of coding can save you hours of planning." — Unknown</desc>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58A6FF; animation: fadeInAnimation 0.8s ease-in-out forwards; }
